name: Figma Console
entryKey: obot-figma-console
serverUserType: singleUser
shortDescription: Extract design systems, create UI components, manage variables, and sync tokens with Figma
description: |
  A Model Context Protocol (MCP) server that bridges design and development, giving AI assistants complete access to Figma for extraction, creation, debugging, and bidirectional token sync.

  ## Features
  - **Design System Extraction**: Pull variables, components, styles, and full design system kits
  - **Write to Canvas**: Create frames, shapes, text, components, and complete UI mockups directly in Figma
  - **Bidirectional Token Sync**: Export Figma variables to multiple formats and push code-side edits back
  - **Variable Management**: Full CRUD operations on design tokens
  - **FigJam Boards**: Create stickies, flowcharts, tables, and code blocks
  - **Figma Slides**: Build and manage presentations programmatically
  - **Accessibility Scanning**: WCAG design checks with conformance level tagging

  ## What you'll need to connect

  **Required:**
  - **Figma Access Token**: A Figma Personal Access Token

  ## Examples
  - "Get all design variables from this Figma file"
  - "Create a card component with header, content, and action button"
  - "Export tokens to Tailwind v4 format"
metadata:
  categories: Design, Developer Tools
icon: https://avatars.githubusercontent.com/u/5155369?s=200&v=4
repoURL: https://github.com/southleft/figma-console-mcp
env:
- key: FIGMA_ACCESS_TOKEN
  name: Figma Access Token
  required: true
  sensitive: true
  description: Your Figma Personal Access Token
runtime: remote
remoteConfig:
  fixedURL: https://figma-console-mcp.southleft.com/sse
toolPreview:
- name: figma_get_status
  description: Check connection status and file context.
  params: {}
- name: figma_take_screenshot
  description: Capture a screenshot of the current Figma canvas.
  params: {}
- name: figma_get_variables
  description: Extract design tokens and variables from a Figma file.
  params:
    fileUrl: "Figma file URL"
