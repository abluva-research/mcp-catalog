name: Figma
entryKey: obot-figma
serverUserType: singleUser
shortDescription: Generate code from Figma designs, extract design context, manage assets, and write to canvas
description: |
  A Model Context Protocol (MCP) server that brings Figma directly into your AI workflow by providing design information and context to AI agents generating code from Figma design files.

  ## Features
  - **Write to Canvas**: Create and modify native Figma content directly from your MCP client including frames, components, variables, and auto layout
  - **Generate Code from Designs**: Select a Figma frame and turn it into code with framework-aware output (React + Tailwind by default)
  - **Extract Design Context**: Pull in variables, components, and layout data directly into your IDE
  - **Code Connect Integration**: Boost output quality by mapping Figma components to your actual codebase components
  - **Asset Management**: Download rendered exports and original source images, or upload assets to Figma files
  - **Design System Search**: Search connected design libraries for components, variables, and styles
  - **FigJam Diagrams**: Generate FigJam diagrams from Mermaid syntax or natural language descriptions
  - **Screenshot Capture**: Allow agents to take screenshots of selections for layout fidelity
  - **Multi-Language Support**: Generate code in React, Vue, plain HTML + CSS, iOS SwiftUI, and more

  ## What you'll need to connect

  **No Setup Required**: Authentication is handled automatically through Figma's OAuth2 workflow.

  **Note:** Rate limits apply to tools that read data from Figma. Users on the Starter plan or with View/Collab seats are limited to 6 tool calls per month. Users with Dev or Full seats on Professional, Organization, or Enterprise plans have per-minute rate limits following Figma's REST API Tier 1 limits.

  ## Examples
  - "Generate my Figma selection in Vue"
  - "Get the variables used in my Figma selection"
  - "Export these icons from my Figma file as SVGs"
  - "Create a flowchart for the user authentication flow"
  - "Search for a button component in my design system"
  - "Add a new frame to my Figma file"
metadata:
  categories: Design, Developer Tools
icon: https://avatars.githubusercontent.com/u/5155369?s=200&v=4
repoURL: https://github.com/figma/mcp-server-guide
toolPreview:
- name: get_design_context
  description: Get the design context for a layer or selection. Returns a structured React + Tailwind representation that agents can translate into any framework.
  params:
    nodeId: "The node ID of the Figma layer to get context for"
    fileKey: "The file key from the Figma file URL"
    clientFrameworks: "Framework label for Code Connect mappings (e.g., React, SwiftUI) (optional)"
    clientLanguages: "Language filter for Code Connect mappings (optional)"
- name: get_metadata
  description: Returns a sparse XML representation of your selection containing layer IDs, names, types, positions, and sizes. Useful for large designs before calling get_design_context on specific nodes.
  params:
    nodeId: "The node ID to get metadata for (optional, returns top-level pages if omitted)"
    fileKey: "The file key from the Figma file URL"
- name: get_screenshot
  description: Takes a screenshot of your selection to help preserve layout fidelity in generated code.
  params:
    nodeId: "The node ID of the Figma layer to screenshot"
    fileKey: "The file key from the Figma file URL"
- name: get_variable_defs
  description: Returns the variables and styles (colors, spacing, typography) used in your Figma selection.
  params:
    nodeId: "The node ID of the Figma layer"
    fileKey: "The file key from the Figma file URL"
- name: download_assets
  description: Downloads rendered exports and original source images from a Figma file. Supports PNG, JPG, SVG, and PDF formats. Up to 20 nodes per call.
  params:
    nodeIds: "List of node IDs to download assets for (up to 20)"
    fileKey: "The file key from the Figma file URL"
    defaultFormat: "Export format: PNG, JPG, SVG, or PDF (optional)"
    defaultScale: "Export scale from 0.01 to 4 (optional)"
- name: upload_assets
  description: Uploads assets (PNG, JPG, GIF, WebP) into a Figma file. Max 10MB per asset.
  params:
    fileKey: "The file key from the Figma file URL"
    nodeId: "Target node ID to upload as a fill (optional, creates new frames if omitted)"
    assets: "List of assets to upload with their URLs or data"
- name: use_figma
  description: General-purpose tool for creating, editing, deleting, or inspecting any object in a Figma Design, FigJam, or Figma Slides file.
  params:
    fileKey: "The file key from the Figma file URL"
    action: "The action to perform on the Figma file"
- name: create_new_file
  description: Creates a new blank Figma Design, FigJam, or Figma Slides file in the authenticated user's drafts.
  params:
    fileType: "Type of file to create (design, figjam, slides)"
    name: "Name for the new file"
- name: generate_diagram
  description: Generates a FigJam diagram from Mermaid syntax or natural language descriptions. Supports flowcharts, Gantt charts, state diagrams, sequence diagrams, architecture diagrams, and ERDs.
  params:
    mermaidSyntax: "Mermaid diagram syntax to convert to FigJam"
    fileKey: "The file key of an existing FigJam file (optional, creates new file if omitted)"
- name: generate_figma_design
  description: Generates design layers from live UI interfaces. Available for select MCP clients during beta.
  params:
    fileKey: "The file key of the target Figma Design file (optional)"
    url: "URL of the web page to capture"
- name: search_design_system
  description: Searches connected design libraries for components, variables, and styles matching a text query.
  params:
    query: "Text query to search for in design libraries"
    fileKey: "The file key to search libraries for"
- name: get_libraries
  description: Returns the libraries currently added to a file (subscribed) and libraries available to add (community UI kits and org libraries).
  params:
    fileKey: "The file key from the Figma file URL"
- name: get_figjam
  description: Converts FigJam diagrams to XML format including screenshots of the nodes.
  params:
    nodeId: "The node ID of the FigJam element"
    fileKey: "The file key from the Figma file URL"
- name: get_code_connect_map
  description: Retrieves a mapping between Figma node IDs and their corresponding code components in your codebase.
  params:
    nodeId: "The node ID of the Figma layer"
    fileKey: "The file key from the Figma file URL"
    clientFrameworks: "Framework label for filtering mappings (e.g., React, SwiftUI) (optional)"
    clientLanguages: "Language filter (optional)"
- name: add_code_connect_map
  description: Adds a mapping between a Figma node ID and its corresponding code component in your codebase.
  params:
    nodeId: "The Figma node ID to map"
    fileKey: "The file key from the Figma file URL"
    componentName: "The name of the code component"
    source: "The file path or URL of the component in your codebase"
- name: get_code_connect_suggestions
  description: Detects and suggests mappings of Figma components to code components in your codebase using Code Connect.
  params:
    nodeId: "The node ID of the Figma layer"
    fileKey: "The file key from the Figma file URL"
- name: send_code_connect_mappings
  description: Confirms the suggested Code Connect mappings after calling get_code_connect_suggestions.
  params:
    mappings: "The confirmed mappings to send"
- name: get_context_for_code_connect
  description: Gets structured component metadata including properties, variants, and descendant tree for generating Code Connect templates.
  params:
    nodeId: "The node ID of the Figma component or component set"
    fileKey: "The file key from the Figma file URL"
- name: get_shader_effect
  description: Retrieves a shader effect and its source files by ID.
  params:
    id: "The shader effect ID (from list_shader_effects)"
    version: "Specific version commit SHA to retrieve (optional)"
- name: get_shader_fill
  description: Retrieves a shader fill and its source files by ID.
  params:
    id: "The shader fill ID (from list_shader_fills)"
    version: "Specific version commit SHA to retrieve (optional)"
- name: list_shader_effects
  description: Lists shader effects in your authenticated account library.
  params:
    cursor: "Pagination cursor for additional results (optional)"
- name: list_shader_fills
  description: Lists shader fills in your authenticated account library.
  params:
    cursor: "Pagination cursor for additional results (optional)"
- name: whoami
  description: Returns the identity of the authenticated user including email, plans, and seat types.
  params: {}
runtime: remote
remoteConfig:
  fixedURL: https://mcp.figma.com/mcp
